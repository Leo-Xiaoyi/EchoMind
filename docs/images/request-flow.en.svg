<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">EchoMind request flow</title><desc id="desc">A customer request passes through the API, context and intent recognition to routing. A single agent or collaborating agents can use skills and tools as needed. Clarification and human handoff are alternative paths. The response is saved and returned. Redis, ChromaDB and observability support the flow.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f5f8fc"/><stop offset="1" stop-color="#eaf1f8"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#8295ab"/></marker></defs>
<rect width="1440" height="1280" rx="28" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
<text x="72" y="90" font-size="17" font-weight="700" letter-spacing="3" fill="#288f92">ECHOMIND  /  REQUEST FLOW</text>
<text x="72" y="147" font-size="48" font-weight="750" fill="#172b45">From question to response</text>
<text x="72" y="187" font-size="21" fill="#587087">A clear path through intent, orchestration and on-demand tools</text>
<rect x="56" y="222" width="1328" height="754" rx="24" fill="#fff" stroke="#dae5ef"/>
<text x="88" y="270" font-size="14" font-weight="700" letter-spacing="2" fill="#7a8fa3">THE REQUEST</text>
<!-- entry -->
<rect x="88" y="292" width="262" height="108" rx="16" fill="#e9f7f5" stroke="#b9e5df"/><text x="110" y="328" font-size="14" font-weight="700" fill="#22847d">01  INPUT</text><text x="110" y="358" font-size="21" font-weight="700" fill="#193448">Customer message</text><text x="110" y="383" font-size="15" fill="#587087">Vue interface or HTTP client</text>
<rect x="416" y="292" width="278" height="108" rx="16" fill="#f2f6fb" stroke="#d5e1ec"/><text x="438" y="328" font-size="14" font-weight="700" fill="#55769a">02  REQUEST GUARD</text><text x="438" y="358" font-size="21" font-weight="700" fill="#193448">FastAPI /chat</text><text x="438" y="383" font-size="15" fill="#587087">Identity · retry receipt · lock</text>
<rect x="760" y="292" width="274" height="108" rx="16" fill="#f2f6fb" stroke="#d5e1ec"/><text x="782" y="328" font-size="14" font-weight="700" fill="#55769a">03  CONTEXT</text><text x="782" y="358" font-size="21" font-weight="700" fill="#193448">Load conversation</text><text x="782" y="383" font-size="15" fill="#587087">Recent turns · relevant memory</text>
<rect x="1100" y="292" width="250" height="108" rx="16" fill="#edf2ff" stroke="#d7dffc"/><text x="1122" y="328" font-size="14" font-weight="700" fill="#6078c1">04  UNDERSTAND</text><text x="1122" y="358" font-size="21" font-weight="700" fill="#193448">Intent &amp; entities</text><text x="1122" y="383" font-size="15" fill="#587087">LLM + embeddings + rules</text>
<g fill="none" stroke="#8295ab" stroke-width="2.5" marker-end="url(#arrow)"><path d="M350 346H407"/><path d="M694 346H751"/><path d="M1034 346H1091"/><path d="M1225 400V435H719V467"/></g>
<rect x="501" y="472" width="436" height="85" rx="16" fill="#243e60"/><text x="719" y="507" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1" fill="#8be0d1">05  ROUTE THE REQUEST</text><text x="719" y="536" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Choose a path using intent and context</text>
<g fill="none" stroke="#8295ab" stroke-width="2.5" marker-end="url(#arrow)"><path d="M580 557V583H264V608"/><path d="M719 557V608"/><path d="M858 557V583H1172V608"/></g>
<rect x="88" y="614" width="352" height="115" rx="16" fill="#f5f8fd" stroke="#d9e4f0"/><text x="110" y="648" font-size="19" font-weight="700" fill="#193448">Single agent</text><text x="110" y="675" font-size="15" fill="#587087">General, Technical or Billing</text><text x="110" y="700" font-size="15" fill="#587087">handles the request</text>
<rect x="484" y="614" width="470" height="115" rx="16" fill="#eef7f7" stroke="#c8e7e3"/><text x="506" y="648" font-size="19" font-weight="700" fill="#193448">Collaborating agents</text><text x="506" y="675" font-size="15" fill="#587087">Primary + supporting roles work in parallel</text><text x="506" y="700" font-size="15" fill="#587087">Response Composer combines their results</text>
<rect x="998" y="614" width="352" height="115" rx="16" fill="#fbf5eb" stroke="#efdfc8"/><text x="1020" y="648" font-size="19" font-weight="700" fill="#193448">Clarify or hand off</text><text x="1020" y="675" font-size="15" fill="#587087">Ask for missing intent or prepare</text><text x="1020" y="700" font-size="15" fill="#587087">a human escalation summary</text>
<path d="M264 729V765H1174V729 M719 729V765" fill="none" stroke="#8295ab" stroke-width="2.5"/><path d="M1130 765V808" fill="none" stroke="#8295ab" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="842" y="818" width="508" height="115" rx="16" fill="#e9f7f5" stroke="#b9e5df"/><text x="864" y="852" font-size="14" font-weight="700" fill="#22847d">06  RESPOND</text><text x="864" y="881" font-size="20" font-weight="700" fill="#193448">Save the turn and return the reply</text><text x="864" y="907" font-size="15" fill="#587087">Redis records the conversation and retry receipt</text>
<rect x="88" y="813" width="687" height="125" rx="16" fill="#f8fafc" stroke="#d9e4f0" stroke-dasharray="6 5"/><text x="110" y="847" font-size="14" font-weight="700" fill="#607c98">AVAILABLE TO AGENTS  ·  AS NEEDED</text><text x="110" y="878" font-size="18" font-weight="700" fill="#193448">Skills  ·  Local tools  ·  Knowledge / RAG  ·  MCP</text><text x="110" y="905" font-size="15" fill="#587087">Role permissions and validation govern tool execution</text>
<path d="M433 813V749" fill="none" stroke="#8fa4b8" stroke-width="2" stroke-dasharray="5 5"/>
<text x="72" y="1029" font-size="14" font-weight="700" letter-spacing="2" fill="#7a8fa3">SUPPORTING THE FLOW</text>
<rect x="72" y="1050" width="402" height="140" rx="16" fill="#fff" stroke="#dae5ef"/><text x="96" y="1088" font-size="19" font-weight="700" fill="#193448">Redis</text><text x="96" y="1117" font-size="15" fill="#587087">Recent turns, task state, locks</text><text x="96" y="1140" font-size="15" fill="#587087">and retry receipts</text>
<rect x="496" y="1050" width="402" height="140" rx="16" fill="#fff" stroke="#dae5ef"/><text x="520" y="1088" font-size="19" font-weight="700" fill="#193448">ChromaDB</text><text x="520" y="1117" font-size="15" fill="#587087">Shared knowledge, searchable episodes</text><text x="520" y="1140" font-size="15" fill="#587087">and user profiles</text>
<rect x="920" y="1050" width="448" height="140" rx="16" fill="#fff" stroke="#dae5ef"/><text x="944" y="1088" font-size="19" font-weight="700" fill="#193448">Observe &amp; evaluate</text><text x="944" y="1117" font-size="15" fill="#587087">Traces, metrics and evaluation help</text><text x="944" y="1140" font-size="15" fill="#587087">inspect behavior and track changes</text>
<text x="72" y="1240" font-size="14" fill="#788da1">Long-term memory maintenance follows the turn in the background.</text><text x="1368" y="1240" text-anchor="end" font-size="14" font-weight="700" fill="#96a9b9">ECHOMIND</text>
</g></svg>